spring.application.name=biblioteca

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081}
app.openlibrary.base-url=${OPENLIBRARY_BASE_URL:https://openlibrary.org}
app.openlibrary.covers-base-url=${OPENLIBRARY_COVERS_BASE_URL:https://covers.openlibrary.org}
app.openlibrary.timeout-ms=${OPENLIBRARY_TIMEOUT_MS:8000}
app.mercadolivre.base-url=${MERCADOLIVRE_BASE_URL:https://api.mercadolibre.com}
app.mercadolivre.timeout-ms=${MERCADOLIVRE_TIMEOUT_MS:5000}
app.mercadolivre.access-token=${MERCADOLIVRE_ACCESS_TOKEN:}
app.mercadolivre.client-id=${MERCADOLIVRE_CLIENT_ID:}
app.mercadolivre.client-secret=${MERCADOLIVRE_CLIENT_SECRET:}
app.price.cache-minutes=${PRICE_CACHE_MINUTES:20}

app.amazon.host=${AMAZON_HOST:webservices.amazon.com.br}
app.amazon.region=${AMAZON_REGION:us-east-1}
app.amazon.marketplace=${AMAZON_MARKETPLACE:www.amazon.com.br}
app.amazon.timeout-ms=${AMAZON_TIMEOUT_MS:5000}
app.amazon.access-key=${AMAZON_ACCESS_KEY:}
app.amazon.secret-key=${AMAZON_SECRET_KEY:}
app.amazon.partner-tag=${AMAZON_PARTNER_TAG:}

app.googlebooks.base-url=${GOOGLEBOOKS_BASE_URL:https://www.googleapis.com}
app.googlebooks.timeout-ms=${GOOGLEBOOKS_TIMEOUT_MS:5000}
app.googlebooks.api-key=${GOOGLEBOOKS_API_KEY:}

management.endpoints.web.exposure.include=health
