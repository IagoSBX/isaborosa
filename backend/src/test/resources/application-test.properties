spring.datasource.url=jdbc:h2:mem:biblioteca-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.cors.allowed-origins=http://localhost:5173
app.openlibrary.base-url=http://localhost:0
app.openlibrary.covers-base-url=http://localhost:0
app.openlibrary.timeout-ms=1000
app.mercadolivre.base-url=http://localhost:0
app.mercadolivre.timeout-ms=1000
app.price.cache-minutes=20
